<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">API and database metrics dashboard</title>
  <desc id="desc">A flat dashboard showing FastAPI latency, database query timings, saturation, and queue depth.</desc>
  <rect width="1280" height="720" fill="#13110f"/>
  <rect x="40" y="36" width="1200" height="648" rx="18" fill="#1c1a17" stroke="#3a352f"/>
  <text x="76" y="88" fill="#f4f1ea" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">API Edge Readiness</text>
  <text x="76" y="122" fill="#a9a197" font-family="Inter, Arial, sans-serif" font-size="15">FastAPI service telemetry · checkout and billing paths</text>
  <rect x="76" y="154" width="250" height="116" rx="12" fill="#26231e" stroke="#423d36"/>
  <text x="100" y="190" fill="#c9c3b8" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="2">P95 LATENCY</text>
  <text x="100" y="234" fill="#f4f1ea" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">184ms</text>
  <rect x="360" y="154" width="250" height="116" rx="12" fill="#26231e" stroke="#423d36"/>
  <text x="384" y="190" fill="#c9c3b8" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="2">DB P95</text>
  <text x="384" y="234" fill="#f4f1ea" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">41ms</text>
  <rect x="644" y="154" width="250" height="116" rx="12" fill="#26231e" stroke="#423d36"/>
  <text x="668" y="190" fill="#c9c3b8" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="2">QUEUE DEPTH</text>
  <text x="668" y="234" fill="#f4f1ea" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">128</text>
  <rect x="928" y="154" width="216" height="116" rx="12" fill="#26231e" stroke="#423d36"/>
  <text x="952" y="190" fill="#c9c3b8" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="2">SATURATION</text>
  <text x="952" y="234" fill="#f4f1ea" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">62%</text>
  <rect x="76" y="304" width="618" height="316" rx="14" fill="#171512" stroke="#3a352f"/>
  <text x="106" y="346" fill="#f4f1ea" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Request Latency by Endpoint</text>
  <line x1="120" y1="558" x2="650" y2="558" stroke="#4a433b"/>
  <line x1="120" y1="386" x2="120" y2="558" stroke="#4a433b"/>
  <polyline points="136,528 198,504 260,522 322,462 384,478 446,430 508,448 570,406 632,420" fill="none" stroke="#d7d1c8" stroke-width="4"/>
  <polyline points="136,548 198,538 260,540 322,514 384,520 446,492 508,500 570,482 632,490" fill="none" stroke="#8f8a82" stroke-width="4"/>
  <text x="136" y="590" fill="#a9a197" font-family="Inter, Arial, sans-serif" font-size="13">/wallet</text>
  <text x="292" y="590" fill="#a9a197" font-family="Inter, Arial, sans-serif" font-size="13">/billing</text>
  <text x="444" y="590" fill="#a9a197" font-family="Inter, Arial, sans-serif" font-size="13">/ledger</text>
  <text x="570" y="590" fill="#a9a197" font-family="Inter, Arial, sans-serif" font-size="13">/search</text>
  <rect x="728" y="304" width="416" height="316" rx="14" fill="#171512" stroke="#3a352f"/>
  <text x="758" y="346" fill="#f4f1ea" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Slow Query Watchlist</text>
  <rect x="758" y="378" width="344" height="42" rx="8" fill="#26231e" stroke="#423d36"/>
  <text x="780" y="405" fill="#c9c3b8" font-family="JetBrains Mono, monospace" font-size="13">ledger.find({"{ userId, status }"})</text>
  <text x="1030" y="405" fill="#f4f1ea" font-family="Inter, Arial, sans-serif" font-size="13">39ms</text>
  <rect x="758" y="434" width="344" height="42" rx="8" fill="#26231e" stroke="#423d36"/>
  <text x="780" y="461" fill="#c9c3b8" font-family="JetBrains Mono, monospace" font-size="13">payments.aggregate(window)</text>
  <text x="1030" y="461" fill="#f4f1ea" font-family="Inter, Arial, sans-serif" font-size="13">52ms</text>
  <rect x="758" y="490" width="344" height="42" rx="8" fill="#26231e" stroke="#423d36"/>
  <text x="780" y="517" fill="#c9c3b8" font-family="JetBrains Mono, monospace" font-size="13">invoices.lookup(account)</text>
  <text x="1030" y="517" fill="#f4f1ea" font-family="Inter, Arial, sans-serif" font-size="13">44ms</text>
  <rect x="758" y="546" width="344" height="42" rx="8" fill="#26231e" stroke="#423d36"/>
  <text x="780" y="573" fill="#c9c3b8" font-family="JetBrains Mono, monospace" font-size="13">webhooks.replay(batch)</text>
  <text x="1030" y="573" fill="#f4f1ea" font-family="Inter, Arial, sans-serif" font-size="13">31ms</text>
</svg>
